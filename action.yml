name: AIVA batch trigger
description: Trigger a batch defined in AIVA via POST /v2/batches/{batchId}/trigger
    and wait for its results
author: YSoft AIVA team

branding:
    icon: airplay
    color: green

inputs:
    apiKey:
        description: AIVA API key (store in a repository or organization secret)
        required: true
    batchId:
        description: ID of the defined batch to trigger.
        required: true
    globalVariableOverrides:
        description: JSON object applied to all tests in the batch. Merged over the overrides
            stored on the batch (a variable named here wins).
        required: false
        default: ''
    apiUrl:
        description: URL for starting a test batch
        required: false
        default: 'https://api.aiva.works/'
    reportFilePath:
        description: Filepath where CTRF report should be saved
        required: false
        default: './batch-ctrf.json'
    artifactName:
        description: Name of the uploaded artifact. Override when multiple invocations
            run in the same workflow to avoid name conflicts.
        required: false
        default: 'batch-status'
    pollPeriodSeconds:
        description: Wait time between retrying API call to check if batch finished
        required: false
        default: 10
    verbose:
        description: Set to true when additional output should be logged
        required: false
        default: false

outputs:
    batchId:
        description: ID of the started batch execution
    batchUrl:
        description: URL to the batch in the AIVA UI
    success:
        description: "'true' if all tests passed, 'false' otherwise"

runs:
    using: node24
    main: dist/index.js
