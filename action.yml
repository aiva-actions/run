name: AIVA batch test run
description: Start an AIVA test batch via POST /v1/batches (see
    https://app.aiva.works/docs/api/batches-run-batch)
author: YSoft AIVA team

branding:
    icon: airplay
    color: green

inputs:
    apiKey:
        description: AIVA API key (store in a repository or organization secret)
        required: true
    labels:
        description: Semicolon-separated labels used to select tests for the batch (e.g.
            "smoke,regression"). Required unless batchId is provided.
        required: false
        default: ''
    batchId:
        description: Run a specific existing batch by its ID instead of selecting tests
            by labels. Mutually exclusive with labels. When set, only batchName may be
            overridden (maxNumberOfAgents, variable overrides and gatewayName are ignored).
        required: false
        default: ''
    batchName:
        description: Custom name of the test batch
        required: false
        default: ''
    maxNumberOfAgents:
        description: Maximum number of agents the batch can use for test execution.
            Defaults to 1. Ignored (and rejected) when batchId is provided.
        required: false
        default: ''
    globalVariableOverrides:
        description: Override for all variables in a test Batch.
        required: false
        default: ''
    variableOverridesPerTest:
        description: Override for variables in a test specified by test ID.
        required: false
        default: ''
    gatewayName:
        description: Name of the gateway that is used by aiva-node during test.
        required: false
        default: ''
    apiUrl:
        description: URL for starting a test batch
        required: false
        default: 'https://api.aiva.works/'
    reportFilePath:
        description: Filepath where CTRF report should be saved
        required: false
        default: './batch-ctrf.json'
    pollPeriodSeconds:
        description: Wait time between retrying API call to check if batch finished
        required: false
        default: 10
    verbose:
        description: Set to true when additional output should be logged
        required: false
        default: false

outputs:
    batchId:
        description: ID of the started test batch
    batchUrl:
        description: URL to the batch in the AIVA UI
    success:
        description: '''true'' if all tests passed, ''false'' otherwise'

runs:
    using: node24
    main: dist/index.js
